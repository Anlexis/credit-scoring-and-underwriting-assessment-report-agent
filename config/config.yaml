# Runtime parameters — loaded by AgentRegistry, passed as Graph(config=...).
# Separate from config/agent.yaml (the static manifest).

max_retry: 3
timeout_s: 30
llm:
  system_prompt_template: "prompts/credit_underwriting_assessment.j2"
  temperature: 0.0
  max_tokens: 2000
retrieval:
  top_k: 5
  score_threshold: 0.1
  rerank_keep: 3
security:
  s3_gate_enabled: true
